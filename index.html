<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f1">
  <meta name="description" content="">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<main class="phone">
  <header class="top">
    <button id="langBtn" class="lang" data-i18n="lang"></button>
    <img class="logo-img" data-image="logo">
    <p class="tagline" data-i18n="tagline"></p>
    <p class="open" data-i18n="openNow"></p>
  </header>

  <!-- Stories section hidden for now -->
  <div id="stories-section" style="display: none;">
    <p class="eyebrow" data-i18n="stories"></p>
    <nav class="highlights" id="highlights" data-i18n-aria-label="storiesLabel"></nav>
  </div>
  <p class="eyebrow" data-i18n="browse"></p>
  <section class="covers" id="covers" data-i18n-aria-label="categoriesLabel"></section>
  
</main>

<!-- Instagram-style story viewer -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-box">
    <div class="progress" id="progress"></div>
    <div class="vhead">
      <a id="avatar" class="avatar" target="_blank" rel="noopener" data-i18n-aria-label="instagramLabel"><img data-image="logo" alt=""></a>
      <a class="handle" href="" target="_blank" rel="noopener"></a>
      <span id="viewerTitle" class="vtitle"></span>
      <button id="closeBtn" class="close" data-i18n-aria-label="close">✕</button>
    </div>
    <img id="slideImg" class="slide-img" alt="">
    <div id="slideBody" class="slide-body">
      <b id="slideTag" class="stag" hidden></b>
      <h2 id="slideName"></h2>
      <p id="slideDesc"></p>
      <span id="slidePrice" class="sprice" hidden></span>
    </div>
    <div id="cta" class="cta" hidden>
      <p id="ctaSlogan" class="cta-big"></p>
      <p id="ctaHandle" class="cta-handle"></p>
      <a id="ctaFollow" class="btn blue" target="_blank" rel="noopener"></a>
      <a id="ctaMore" class="btn dark"></a>
    </div>
    <button id="tapPrev" class="tap tap-prev" data-i18n-aria-label="previous"></button>
    <button id="tapNext" class="tap tap-next" data-i18n-aria-label="next"></button>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/stories.js"></script>
</body>
</html>
